name: Atualização Semanal do S&P 500 por Setores

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: 'Forçar atualização mesmo sem mudanças'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Executar script de atualização
        run: python scripts/update_sectors.py

      - name: Verificar mudanças
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Nenhuma mudança detectada no dataset."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Mudanças detectadas — commitando..."
          fi

      - name: Commit e push das mudanças
        if: steps.changes.outputs.changed == 'true' || github.event.inputs.force == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: atualização automática semanal do S&P 500 por setores (${{ github.run_id }})"
          git push

      - name: Resumo da execução
        run: |
          echo "## Resumo da Atualização" >> $GITHUB_STEP_SUMMARY
          echo "- **Data**: $(date -u +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- **Run ID**: ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.changes.outputs.changed }}" = "true" ]; then
            echo "- **Status**: ✅ Dataset atualizado e commitado" >> $GITHUB_STEP_SUMMARY
            echo "- **Mudanças**:" >> $GITHUB_STEP_SUMMARY
            git diff --stat HEAD~1 >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Status**: ℹ️ Nenhuma mudança no dataset" >> $GITHUB_STEP_SUMMARY
          fi