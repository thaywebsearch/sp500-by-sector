# netlify.toml - Configurações SEO e Performance do SP500 Dashboard

[build]
  command = "npm run build"
  publish = "dist"
  functions = "functions"

# Redirect HTTP para HTTPS (automático no Netlify)
[[redirects]]
  from = "http://*"
  to = "https://:splat"
  status = 301
  force = true

# Redirecionar URLs antigas (se houver)
[[redirects]]
  from = "/dashboard"
  to = "/"
  status = 301

# Redirecionar /setores/* para /setor/* (se mudar estrutura)
[[redirects]]
  from = "/setores/:setor"
  to = "/setor/:setor"
  status = 301

# SPA fallback (importante para React/Vue)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ============ CACHE HEADERS ============

# API - Sem cache ou cache curto
[[headers]]
  path = "/api/*"
  headers = [
    ["Cache-Control", "no-cache, must-revalidate, max-age=0"],
    ["Expires", "0"]
  ]

# Assets estáticos - Cache longo (imagens, fonts)
[[headers]]
  path = "/static/*"
  headers = [
    ["Cache-Control", "public, max-age=31536000, immutable"],
    ["Access-Control-Allow-Origin", "*"]
  ]

[[headers]]
  path = "*.woff2"
  headers = [
    ["Cache-Control", "public, max-age=31536000, immutable"],
    ["Content-Type", "font/woff2"]
  ]

[[headers]]
  path = "*.woff"
  headers = [
    ["Cache-Control", "public, max-age=31536000, immutable"],
    ["Content-Type", "font/woff"]
  ]

# Imagens - Cache médio
[[headers]]
  path = "/images/*"
  headers = [
    ["Cache-Control", "public, max-age=2592000"],
    ["Expires", "+30 days"]
  ]

# HTML - Cache curto com validação
[[headers]]
  path = "/*.html"
  headers = [
    ["Cache-Control", "public, max-age=3600, must-revalidate"],
    ["Content-Type", "text/html; charset=utf-8"]
  ]

# Página raiz
[[headers]]
  path = "/"
  headers = [
    ["Cache-Control", "public, max-age=3600, must-revalidate"],
    ["Content-Type", "text/html; charset=utf-8"]
  ]

# Sitemap e robots
[[headers]]
  path = "/sitemap.xml"
  headers = [
    ["Content-Type", "application/xml"],
    ["Cache-Control", "public, max-age=86400"]
  ]

[[headers]]
  path = "/robots.txt"
  headers = [
    ["Content-Type", "text/plain"],
    ["Cache-Control", "public, max-age=86400"]
  ]

# ============ SECURITY HEADERS ============

[[headers]]
  path = "/*"
  headers = [
    # Previne ataques MIME type sniffing
    ["X-Content-Type-Options", "nosniff"],
    
    # Clickjacking protection
    ["X-Frame-Options", "SAMEORIGIN"],
    
    # XSS Protection
    ["X-XSS-Protection", "1; mode=block"],
    
    # Referrer Policy (privacidade)
    ["Referrer-Policy", "strict-origin-when-cross-origin"],
    
    # Permissions Policy
    ["Permissions-Policy", "geolocation=(), microphone=(), camera=()"],
    
    # HSTS (força HTTPS por 1 ano)
    ["Strict-Transport-Security", "max-age=31536000; includeSubDomains; preload"],
    
    # Content Security Policy (evita injeção de scripts)
    ["Content-Security-Policy", "default-src 'self' https:; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://www.google-analytics.com https://api.example.com; media-src 'self'; object-src 'none'"],
    
    # Permissões do navegador
    ["Feature-Policy", "accelerometer 'none'; camera 'none'; geolocation 'none'; gyroscope 'none'; magnetometer 'none'; microphone 'none'; payment 'none'; usb 'none'"]
  ]

# ============ COMPRESSÃO ============

[build.environment]
  NODE_ENV = "production"
  # Netlify automaticamente ativa gzip/brotli

# ============ NETLIFY FUNCTIONS (Opcional) ============

[functions]
  directory = "functions"
  node_bundler = "esbuild"

# ============ DEPLOY SETTINGS ============

[context.production]
  command = "npm run build"
  
[context.preview]
  command = "npm run build"
  
[context.branch-deploy]
  command = "npm run build"

# ============ FORMS (Se usar) ============

[[forms]]
  name = "contact"
  honeypot = "bot-field"
  redirect = "/thank-you"
